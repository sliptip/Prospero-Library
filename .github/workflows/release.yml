name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c 'from backend import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version' }
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          $publish = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/setup-node@v6
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows tray application
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test and package source ZIP
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          & ./.venv/Scripts/python.exe -m unittest discover -s tests -p test_self_update.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows update tests failed' }
          & ./.venv/Scripts/python.exe scripts/package_release.py
      - name: Verify the packaged app
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "Prospero Smoke"
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $env:PROSPERO_DATA = Join-Path $testRoot "data"
          $env:PROSPERO_PORT = '18437'
          $env:PROSPERO_EMPTY_LIBRARY = '1'
          $target = Join-Path $testRoot "ProsperoTraySmoke.exe"
          Copy-Item './dist/Prospero Library.exe' $target
          $process = Start-Process -FilePath $target -ArgumentList '--background' -PassThru
          $helper = $null
          try {
            $deadline = (Get-Date).AddSeconds(40)
            $health = $null
            while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18437/api/health' -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($health.version -ne $env:VERSION -or -not $health.app_update) {
              throw 'The packaged Windows app did not start with its updater enabled.'
            }
            $staged = Join-Path $testRoot ".prospero-update-smoke"
            New-Item -ItemType Directory -Path $staged | Out-Null
            Copy-Item $target (Join-Path $staged "pending.exe")
            $helperPath = Join-Path $staged "helper.exe"
            Copy-Item $target $helperPath
            $db = Join-Path $env:PROSPERO_DATA "library.db"
            $arguments = @('--apply-update', $process.Id, $env:PROSPERO_PORT, $env:VERSION, "`"$target`"", "`"$db`"")
            $helper = Start-Process -FilePath $helperPath -ArgumentList $arguments -PassThru
            taskkill.exe /PID $process.Id /T /F | Out-Null
            if (-not $helper.WaitForExit(65000) -or $helper.ExitCode -ne 0 -or
                -not (Test-Path (Join-Path $staged "finished"))) {
              throw 'The Windows app updater did not replace and restart the packaged EXE.'
            }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18437/api/health' -TimeoutSec 3
            if ($health.version -ne $env:VERSION -or -not $health.app_update) {
              throw 'Prospero did not respond after the update.'
            }
          } finally {
            if ($helper -and -not $helper.HasExited) {
              taskkill.exe /PID $helper.Id /T /F | Out-Null
            }
            Get-Process -Name "ProsperoTraySmoke" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $name = "Prospero-Library-${env:VERSION}-Windows-x64.exe"
          Copy-Item './dist/Prospero Library.exe' "./dist/$name"
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version = $env:VERSION
          gh release create "v$version" "release/Prospero-Library-$version.zip" "dist/Prospero-Library-$version-Windows-x64.exe" `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Prospero Library $version" --notes-file release/release-notes.md
